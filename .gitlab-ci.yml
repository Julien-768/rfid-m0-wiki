# .gitlab-ci.yml

stages:
- lint
- test
- pages
- deploy

include:
- project: "iphc/ci-templates"
  file: "/templates/python/template.yml"
  ref: "develop" # or a specific tag/commit

- project: "iphc/ci-templates"
  file: "/templates/mike/template.yml"
  ref: "develop"
  inputs:
    mk_path: "."
    mkdocs_config_file: "mkdocs.yml"
    pages_stage: "pages"
    job_execution_mode: "both"
    publication_branch: "develop"
    publication_keyword: "(^Merge branch .+ into .?develop.?)|(publication)"
    exclusion_branch: "exclusion-branch"
    mike_branch: "pages/mike"

# --- Deploy stage ---
- project: "iphc/ci-templates"
  file: "templates/github-sync/template.yml"
  ref: "develop"
  inputs:
    branches: "develop|main|github"
    github_repo: "Julien-768/rfid-m0-wiki"
    stage: deploy
