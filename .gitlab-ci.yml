image: python:latest

before_script:
  - time pip install -r requirements.txt
  # weasyprint only
  # - apt install python3-pip python3-cffi python3-brotli libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

pages:
  stage: deploy
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PAGES_BRANCH: gl-pages
    HTTPS_REMOTE: https://gitlab-ci-token:${ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
  before_script:
    - time pip install -r requirements.txt
    - time git config user.name $GITLAB_USER_NAME
    - time git config user.email $GITLAB_USER_EMAIL
    - time git fetch origin $PAGES_BRANCH && git checkout -b $PAGES_BRANCH origin/$PAGES_BRANCH || echo "Pages branch not deployed yet."
    - time git checkout $CI_COMMIT_SHA
  script:
   - time mike deploy --rebase --prefix public -r $HTTPS_REMOTE -p -b $PAGES_BRANCH -u $CI_COMMIT_TAG depreciated
   - time mike set-default --rebase --prefix public -r $HTTPS_REMOTE -p -b $PAGES_BRANCH depreciated
   - time git checkout $PAGES_BRANCH -- public/
  artifacts:
    paths:
     - public/