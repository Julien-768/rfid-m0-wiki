site_name: RFID_M0
site_url:  https://rfid_m0.pages.in2p3.fr/rfid_m0.wiki
site_author: Julien Courtecuisse
site_description: >-
                  Provide information to set up and use the rfid_m0.code

# Repository
repo_name: rfid_m0
repo_url: https://gitlab.in2p3.fr/rfid_m0
# Copyright
copyright: Copyright &copy; 2017 - 2023 IPHC's technical platform MIBE

extra:
# language
   alternate:
      - name: Français
        link: /fr/
        lang: fr
      - name: English
        link: /en/
        lang: en
# site analytics
   analytics:
      provider: google
      property: G-XXXXXXXXXX #TODO leave empty if not using google analytics, else fill
      feedback:
         title: Was this page helpful?
         ratings:
         - icon: material/emoticon-happy-outline
           name: This page was helpful
           data: 1
           note: >-
               Thanks for your feedback!
         - icon: material/emoticon-sad-outline
           name: This page could be improved
           data: 0
           note: >-
               Thanks for your feedback! Help us improve this page by
               <a href=" mailto:julien.courtecuisse@iphc.cnrs.fr?subject=%5Brfid_app.wiki%5D%20Feedback&body=Please%20submit%20your%20feedback "
               target="_blank" rel="noopener">sending us your feedback</a>
              #TODO fill if not using google analytics

# Configuration
theme:
   name: material
   logo: assets/images/logo_MIBE.png
   favicon: assets/favicon.ico
   collapse_navigation: false
   features:
     - content.code.copy
     - content.code.annotate
     - navigation.tabs
     - navigation.footer

   custom_dir: overrides

   palette:
      # Palette toggle for light mode
      - media: "(prefers-color-scheme: light)"
        primary: orange
        scheme: default
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode

      # Palette toggle for dark mode
      - media: "(prefers-color-scheme: dark)"
        primary: orange
        scheme: slate
        toggle:
          icon: material/brightness-4
          name: Switch to system preference
   font:
      text: Roboto
      code: Roboto Mono

# Extensions
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      guess_lang: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - pymdownx.details

extra_javascript:
  - javascripts/feedback.js
  - giscus.json

plugins:
  - git-revision-date-localized:
      fallback_to_build_date: true
  - search

nav:
    - Home: index.md

    - User:
      - Device for rodent species:
        - Overview: Device_description.md
        - First time use: First_time_use.md
        - Checking procedure: Checking_procedure.md
      - Software:
        - Functioning: Software_functioning.md
        - Configuration: Software_configuration.md

    - Hardware:
      - Rodent species case: Rodent_species_case.md
      - Burrow antenna: Antenna_Burrow.md
      - Nest box antenna: Antenna_schwegler.md

    - Developper:
    
      - Electronic boards:
        - Overview: Electronic_overview.md
        - Main board: Main_board.md
        - 5V power supply board: Power-5V.md
        - 12V power supply board: Power-12V.md
        - Infrared: Infrared.md

      - Assembly a burrow case:
        - Antenna: Antenna_burrow_assembly.md
        - Electronic: Electronic_assembly.md
        - Burrow case: Burrow_case.md
        - Programming: programming.md
        - Final assembly: Burrow_case_assembly.md

      - Assembly a nest box:
        - Antenna: Antenna_nest_assembly.md
        - Electronic: Electronic_assembly.md
        - Nest box: Nest_box.md
        - Programming: programming.md
        - Final assembly: Nest_box_assembly.md

      - Manufacturing files: Elec_Manufacturing.md
      - Mods for next revision: Elec_boards_TODO.md

    - TO SORT:
      - TODO liste: TODO-liste.md
      - Check liste: Check-list.md
      - ToBeMoved: To_be_moved.md
      - JLINK-bootloader: JLINK-bootloader.md
